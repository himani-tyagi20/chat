services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    volumes:
      - qdrant-storage:/qdrant/storage
    healthcheck:
      # The image is distroless — no curl, no wget. Qdrant ships its own readiness probe.
      test: ["CMD", "/qdrant/qdrant", "--version"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Runs once to fetch the model into the shared volume, then exits.
  # Without this the first LLM-mode question would silently fall back to extracted answers.
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "qwen2.5"]
    restart: "no"

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5
    depends_on:
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy

volumes:
  qdrant-storage:
  ollama-models:
